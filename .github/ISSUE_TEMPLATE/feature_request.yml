name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the operational problem first. Please do not include sensitive
        infrastructure details.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or operational need should be addressed?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and configuration, if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Describe workarounds or other approaches you considered.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This request keeps firewall changes conservative and auditable.
          required: true
        - label: I searched the existing issues for similar requests.
          required: true
